
name: Deploy CVWerk Schweiz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract website
        run: |
          set -e
          ZIP="CVWerk-Schweiz-Netlify-v10.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP archive not found: $ZIP"
            ls -la
            exit 1
          fi

          mkdir public
          unzip -q "$ZIP" -d public

      - name: Validate published files
        run: |
          set -e

          test -s public/index.html
          test -s public/sitemap.xml
          test -s public/robots.txt

          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("public/sitemap.xml")
          namespace = "http://www.sitemaps.org/schemas/sitemap/0.9"
          root = ET.parse(path).getroot()

          if root.tag != f"{{{namespace}}}urlset":
              raise SystemExit(f"Wrong root element: {root.tag}")

          entries = root.findall(f"{{{namespace}}}url")
          if not entries:
              raise SystemExit("No URL entries found")

          expected = "https://andrii9292.github.io/cvwerk-schweiz/"

          for i, entry in enumerate(entries, 1):
              loc = entry.find(f"{{{namespace}}}loc")
              if loc is None or not loc.text:
                  raise SystemExit(f"URL #{i} has no loc")
              if not loc.text.strip().startswith(expected):
                  raise SystemExit(f"Unexpected URL: {loc.text}")

          print(f"SUCCESS: sitemap structure is valid")
          print(f"SUCCESS: {len(entries)} URLs validated")
          print("SUCCESS: required files exist in public/")
          PY

          echo "=== Files in public ==="
          find public -maxdepth 2 -type f | sort

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
